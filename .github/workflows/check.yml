name: Verifica base collaborativa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: integrations/paseo-collaborativo
      - run: npm run typecheck
        working-directory: integrations/paseo-collaborativo
